<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Etiqueta para Redimensionar</title>
    <style>
        /* Ya no necesitamos la directiva @page */
        html, body {
            width: 100%;
            height: auto; /* La altura crecerá según el contenido */
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            padding: 20px; /* Padding generoso en píxeles */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Espacio generoso entre elementos */
        }
        
        .text-content {
            width: 100%;
            text-align: center;
        }
        
        p { margin: 3px 0; }

        /* Usamos fuentes grandes porque sabemos que luego se van a encoger */
        .product-name {
            font-weight: bold;
            font-size: 20pt; 
        }
        
        .details {
            text-align: left;
            font-size: 16pt;
        }
        
        .barcode-content {
            width: 100%;
            text-align: center;
        }

        .barcode-content img {
            max-width: 100%;
        }
        
        .barcode-label {
            font-size: 14pt;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-content">
            <p class="product-name">{{ datos_producto.nombre }}</p>
            <div class="details">
                <p>Ref: {{ datos_producto.referencia_interna }}</p>
                <p>Lote: {{ datos_producto.numero_lote_serial }}</p>
            </div>
        </div>
        
        <div class="barcode-content">
            {% if commercial_barcode_base64 %}
                <img src="data:image/png;base64,{{ commercial_barcode_base64 }}">
                <p class="barcode-label">{{ datos_producto.codigo_barras }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
