<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Etiqueta Adaptativa</title>
    <style>
    /* Reseteo básico */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: auto; 
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        background-color: white;
        overflow: hidden;
    }

    /* Anula los márgenes automáticos de los párrafos */
    p {
        margin: 2px 0;
    }

    /* Contenedor principal simplificado */
    .container {
        width: 100%;
        height: auto;
        box-sizing: border-box;
    }
    
    /* Contenedor para el logo y el texto */
    .header-content {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 5%;
        margin-bottom: 5px;
    }

    .logo-content {
        flex: 0 0 30%;
        max-width: 30%;
    }

    .logo-content img {
        width: 100%;
        height: auto;
        object-fit: contain;
    }
    
    .text-content {
        flex: 1 1 auto;
        text-align: left;
    }

    .product-name {
        font-weight: bold;
        font-size: auto;
    }
    
    .details {
        font-size: auto;
    }
    
    .barcode-content {
        width: 100%;
        /* ======================================================= */
        /* == CAMBIO: Centra todo el contenido (imagen y texto) == */
        /* ======================================================= */
        text-align: center; 
    }

    .barcode-content img {
        width: 100%;
        height: auto;
    }
    
    .barcode-label {
        font-size: auto;
        letter-spacing: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        
        <div class="header-content">
            <div class="logo-content">
                {% if logo_base64 %}
                    <img src="data:image/png;base64,{{ logo_base64 }}" alt="Logotipo">
                {% endif %}
            </div>
            
            <div class="text-content">
                <p class="product-name">{{ datos_producto.nombre }}</p>
                <div class="details">
                    <p>Ref: {{ datos_producto.referencia_interna }}</p>
                    <p>Lote: {{ datos_producto.numero_lote_serial }}</p>
                </div>
            </div>
        </div>
        
        <div class="barcode-content">
            {% if commercial_barcode_base64 %}
                <img src="data:image/png;base64,{{ commercial_barcode_base64 }}" alt="Código de barras">
                <p class="barcode-label">{{ datos_producto.codigo_barras }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
