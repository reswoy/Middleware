<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Etiqueta Adaptativa</title>
    <style>
    /* Reseteo básico para eliminar márgenes y espaciados por defecto */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        background-color: white;
        overflow: hidden;
    }

    /* Contenedor principal que ocupa todo el espacio disponible */
    .container {
        width: 100%;
        height: auto; /* Altura automática para ajustarse al contenido */
        box-sizing: border-box;
        padding: 5%; /* Un poco menos de padding para maximizar espacio */

        display: flex;
        flex-direction: column;
        justify-content: space-evenly; 
        align-items: center;
        text-align: center;
    }
    
    /* --- TAMAÑOS BASADOS SIEMPRE EN EL ANCHO (VW) --- */

    .product-name {
        font-weight: bold;
        font-size: auto; /* Tamaño grande, basado en el ancho */
    }
    
    .details {
        text-align: left;
        font-size: auto; /* Tamaño mediano, basado en el ancho */
    }
    
    .barcode-content {
        width: 90%;
    }

    .barcode-content img {
        width: 100%;
        height: auto;
    }
    
    .barcode-label {
        font-size: auto; /* Mismo tamaño que .details, basado en el ancho */
        letter-spacing: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="text-content">
            <p class="product-name">{{ datos_producto.nombre }}</p>
            <div class="details">
                <p>Ref: {{ datos_producto.referencia_interna }}</p>
                <p>Lote: {{ datos_producto.numero_lote_serial }}</p>
            </div>
        </div>
        
        <div class="barcode-content">
            {% if commercial_barcode_base64 %}
                <img src="data:image/png;base64,{{ commercial_barcode_base64 }}" alt="Código de barras">
                <p class="barcode-label">{{ datos_producto.codigo_barras }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
